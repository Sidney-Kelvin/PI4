name: CI

# Integração contínua do FinanTrack (PI4): testes, lint e build.
# Não há deploy em nuvem: o ambiente oficial é local (Docker Desktop + Docker Compose).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências (PyTorch CPU)
        working-directory: backend
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements.txt

      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
        run: pytest tests/ -v --tb=short --junit-xml=test-results.xml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        working-directory: backend
        run: ruff check app/ tests/

  frontend-build:
    name: Frontend — Type check e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Type check + build
        working-directory: frontend
        run: npm run build

  docker-compose:
    name: Docker Compose — Validação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Build das imagens
        run: docker compose build
